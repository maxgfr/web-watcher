name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck -s bash -S warning script.sh tests/run.sh

  syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax
        run: bash -n script.sh tests/run.sh

  test:
    name: Functional Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      WEBINDEX_VERSION: "1.20.0"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
            # Decimal-comma locale: the suite runs every test under it too
            sudo locale-gen fr_FR.UTF-8
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install jq
          fi

      - name: Install webindex
        run: |
          curl -fsSL "https://github.com/maxgfr/webindex/archive/refs/tags/v${WEBINDEX_VERSION}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec node "%s/webindex-%s/scripts/webindex.mjs" "$@"\n' \
            "$RUNNER_TEMP" "$WEBINDEX_VERSION" > "$HOME/bin/webindex"
          chmod +x "$HOME/bin/webindex"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run test suite
        run: bash tests/run.sh
