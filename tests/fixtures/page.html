<!DOCTYPE html>

<head>

       spanning lines -->

    body { color: red; }
    a > span { display: none; }
  </style>
  <SCRIPT type="text/javascript">
    var t = Date.now(); if (t < 0) { console.log("never"); }
  </SCRIPT>
</head>
<body>
  <h1>Hello</h1>
  <p class="price">Price: 10&nbsp;&euro; &#169; &#x27;quoted&#x27;</p>

     href="/p/1"
     class="link">Product</a>
  <div data-mw='{"parts":[{"template":"&lt;!--note--&gt; a > b"}]}' class="meta">Visible</div>
  <script>
    var nonce = "abc123";
  </script>
</body>
</html>
